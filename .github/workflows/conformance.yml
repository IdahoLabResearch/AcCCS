name: Conformance suite

# Runs the AcCCS conformance suite (tests/conformance/) as a hard PR gate.
# See ADR-0003 and tests/conformance/README.md.
#
# Runner requirements:
#   - CAP_NET_ADMIN (GitHub-hosted ubuntu-latest provides this; the workflow
#     calls `sudo ./setup_veth.sh` to provision the acccs_secc/acccs_evcc
#     veth pair before pytest runs).
#   - CAP_NET_RAW on the Python interpreter: the emulator subprocesses open
#     AF_PACKET/SOCK_RAW sockets for SLAC. The hosted job runs pytest as a
#     non-root user, so it `setcap cap_net_raw+eip`s the interpreter (the Pi
#     and local conda interpreters already carry this file capability).
#   - A C/C++ build toolchain (CMake >=3.20, Ninja >=1.10, build-essential):
#     EXPy builds a libcbv2g extension during `pip install` (see ADR-0002).
#   - Python 3.12 with the project's requirements.txt installed.
#
# Self-hosted runners (incl. the AcCCS-box Pi as a pre-merge job under a
# label-triggered workflow) must mirror these prerequisites — see ADR-0003
# § Substrate and gating.

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up C/C++ build toolchain
        # EXPy (the EXI codec) builds a libcbv2g C/C++ extension during
        # `pip install`, so the runner needs CMake + Ninja + a compiler
        # before the dependency install step (see ADR-0002). ubuntu-latest
        # ships cmake/build-essential but not ninja-build.
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt pins smbus which only builds on Linux with i2c
          # headers. The conformance suite does not need smbus (it stubs the
          # SMBus path via VIRTUAL=True). Install everything else.
          grep -v '^smbus' requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt

      - name: Grant CAP_NET_RAW to the Python interpreter
        # The E2E layer spawns run_evcc.py / run_secc.py, whose SLAC handler
        # opens an AF_PACKET/SOCK_RAW socket at startup
        # (app/{secc,evcc}/transport/slac.py: create_socket). That syscall
        # needs CAP_NET_RAW. pytest here runs as a normal (non-root) user and
        # the setup-python interpreter carries no file capabilities, so without
        # this step both emulator subprocesses crash immediately with
        # `PermissionError: [Errno 1] Operation not permitted` before SLAC
        # sends a single packet — and every E2E scenario (din-happy included,
        # since SLAC precedes all TLS/cert work) reports `done=False`. See
        # issue #46. This mirrors how the AcCCS-box Pi and local conda
        # interpreters already carry `cap_net_raw=eip` (which is why the suite
        # passes there). File capabilities are inherited across exec, so
        # granting them on the interpreter covers the spawned subprocesses too.
        run: |
          PYBIN="$(readlink -f "$(which python)")"
          sudo setcap cap_net_raw+eip "$PYBIN"
          # Fail loudly *here* if setcap did not take or broke interpreter
          # startup, rather than later as an opaque batch of `done=False`.
          getcap "$PYBIN"
          python -c "import socket; socket.socket(socket.AF_PACKET, socket.SOCK_RAW, socket.htons(0x0003)); print('CAP_NET_RAW OK')"

      - name: Provision veth pair
        # The E2E layer talks over acccs_secc ⇄ acccs_evcc. setup_veth.sh
        # uses `ip link` which needs CAP_NET_ADMIN — ubuntu-latest grants
        # this via sudo by default.
        run: sudo ./setup_veth.sh

      - name: Generate TLS/PnC certificates
        # The ISO-2 / ISO-20 TLS and PnC E2E scenarios need a cert chain; the
        # emulators read it from app/shared/pki/iso15118_2/certs (CertPath in
        # app/shared/security.py resolves every protocol there). create_certs.sh
        # writes paths relative to its CWD, so it must run from app/shared/pki.
        # `-v iso-2` generates the whole tree the scenarios use; `-v iso-20` is
        # currently broken (#48) and is not needed — iso-20 scenarios read the
        # same iso15118_2/certs tree.
        working-directory: app/shared/pki
        run: bash create_certs.sh -v iso-2

      - name: Run conformance suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/conformance/ -v

      - name: Tear down veth pair
        if: always()
        run: sudo ./remove_veth.sh
