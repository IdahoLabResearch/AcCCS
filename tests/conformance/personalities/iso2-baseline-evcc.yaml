# Conformance ISO 15118-2 EVCC personality, tree-backed via the shipped Mach-E
# baseline (ADR-0006 / #97). Extends the repo `iso2-evcc-baseline` (resolved
# through the personality search path) and only adds the veth interface plus a
# target start voltage under the baseline's 422 V envelope, so the E2E asserts the
# baseline wire values the EVCC actually emits. Mirrors `iso2-baseline-secc.yaml`.
extends: iso2-evcc-baseline
role: evcc
residual:
  # EV DC charge-ramp start seeds relocated from the retired
  # `power.ev_dc` block (#102): no static wire form, so residual.
  charge_ramp:
    target_voltage_v: 400.0
    target_current_a: 1.5
  network:
    interface: acccs_evcc
