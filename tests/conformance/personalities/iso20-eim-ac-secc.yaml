# Conformance ISO 15118-20 EIM AC SECC test personality.
#
# Mirrors `iso20-eim-secc.yaml` (DC) but selects the AC energy service
# (issue #36 — automated parity for the manually-verified -20 AC path of
# #32). ISO 15118-20 mandates TLS 1.3 regardless of auth mode
# (`app/secc/secc_settings.py` rejects TLS-off with ISO-20), so this
# personality keeps TLS on. Pairs with `iso20-eim-ac-evcc.yaml` via the
# `iso20-eim-ac` scenario.
#
# ISO 15118-20 negotiates the energy service via `supported_energy_services`,
# not an energy-transfer-mode field (a DIN / ISO 15118-2 concept, tree-migrated
# in #105), so this AC personality carries none.
capabilities:
  supported_protocols:
  - ISO_15118_20_AC
  supported_auth_modes:
  - EIM
  supported_energy_services:
  - AC
residual:
  network:
    interface: acccs_secc
  tls:
    enable_tls_1_3: true
    enforce_tls: true
role: secc
