# Conformance app-protocol fallback SECC personality (issue #21).
#
# Supports DIN SPEC 70121 only. Paired with `fallback-evcc-multi` (which
# offers ISO-20 > ISO-2 > DIN), this forces the SECC to walk past the two
# higher-priority offers and negotiate DIN — the SECC is the constraining
# side of the asymmetry. TLS off (DIN mandates no transport-layer security).
identity:
  evse_id: 49A89A6360
capabilities:
  supported_protocols:
  - DIN_SPEC_70121
  supported_energy_services:
  - DC
residual:
  network:
    interface: acccs_secc
  tls:
    enable_tls_1_3: false
    enforce_tls: false
role: secc
