# Conformance ISO 15118-20 AC EVCC personality, tree-backed via the shipped
# baseline (ADR-0006 / #101). Extends the repo `iso20-ac-evcc-baseline` (resolved
# through the personality search path) and only adds the veth interface, so the
# E2E asserts the baseline wire values the EVCC actually emits (the tree-sourced
# plain-AC ChargeParameterDiscovery requested envelope). The baseline requests AC,
# so it pairs with `iso20-ac-baseline-secc.yaml`, whose baseline advertises AC.
# TLS 1.3 stays on (inherited from the baseline; ISO-20 mandates it).
extends: iso20-ac-evcc-baseline
role: evcc
residual:
  network:
    interface: acccs_evcc
