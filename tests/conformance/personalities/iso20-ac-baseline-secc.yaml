# Conformance ISO 15118-20 AC SECC personality, tree-backed via the shipped
# baseline (ADR-0006 / #100). Extends the repo `iso20-ac-secc-baseline` (resolved
# through the personality search path) and only adds the veth interface, so the
# E2E asserts the baseline wire values the SECC actually emits (SessionSetupRes
# EVSEID and the tree-sourced plain-AC ChargeParameterDiscovery envelope). TLS 1.3
# stays on (inherited from the baseline; ISO-20 mandates it). Pairs with the
# existing `iso20-eim-ac-evcc.yaml`, which requests the AC energy service.
extends: iso20-ac-secc-baseline
role: secc
residual:
  network:
    interface: acccs_secc
