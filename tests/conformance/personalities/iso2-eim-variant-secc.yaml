# Conformance ISO 15118-2 EIM SECC variant test personality.
#
# Mirrors `personalities/iso2_eim_dc.yaml` so the E2E suite
# can pin an `iso2-eim-variant` scenario.
capabilities:
  supported_protocols:
  - ISO_15118_2
  supported_auth_modes:
  - EIM
  supported_energy_services:
  - DC
residual:
  # SECC meter-reading start seed (relocated from the retired `meter` block, #105).
  # The ISO-2 SECC does not emit MeterInfo (meter_info stays None), so the id is
  # dropped and this seed is unused on the wire — kept for parity with the model.
  metering:
    starting_reading_wh: 555000
  network:
    interface: acccs_secc
  tls:
    enable_tls_1_3: false
    use_tls: false
    enforce_tls: false
role: secc
