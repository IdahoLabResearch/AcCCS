# Conformance DIN 70121 SECC variant test personality.
#
# Mirrors `personalities/din_reference.yaml` so the E2E suite can
# pin a `din-variant` scenario without dragging the example file into the
# conformance test directory.
capabilities:
  supported_protocols:
  - DIN_SPEC_70121
  supported_energy_services:
  - DC
# The SECC-advertised energy transfer mode is a message-field-tree leaf now (#105);
# the WrongEnergyTransferType reject-gate reads the same leaf (advertised ==
# accepted). ServiceDiscoveryRes's other required leaves are spelled out to
# satisfy the load-time completeness check.
message_field_tree:
  DIN_SPEC_70121:
    ServiceDiscoveryRes:
      PaymentOptions:
        PaymentOption:
        - ExternalPayment
      ChargeService:
        ServiceTag:
          ServiceID: 1
          ServiceCategory: EVCharging
        FreeService: false
        EnergyTransferType: DC_core
residual:
  network:
    interface: acccs_secc
  tls:
    enable_tls_1_3: false
    use_tls: false
    enforce_tls: false
role: secc
