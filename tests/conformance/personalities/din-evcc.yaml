# Conformance DIN 70121 EVCC test personality.
# DIN-only protocol selection; TLS off (DIN doesn't use TLS); virtual mode
# is a runtime knob, set via --virtual on the spawned subprocess.
identity:
  evcc_id: 1FMVAA45B63C47DD58Y6
capabilities:
  supported_protocols:
  - DIN_SPEC_70121
  supported_energy_services:
  - DC
  energy_transfer_mode: DC_extended
residual:
  network:
    interface: acccs_evcc
  tls:
    enable_tls_1_3: false
    use_tls: false
    enforce_tls: false
role: evcc
