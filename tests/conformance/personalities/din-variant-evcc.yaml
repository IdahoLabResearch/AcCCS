# Conformance DIN 70121 EVCC variant test personality.
#
# Mirrors `personalities/din_reference.yaml` so the E2E suite can
# pin a `din-variant` scenario without dragging the example file into the
# conformance test directory. The interface (network/) is the conformance
# veth pair; everything else matches the variant.
capabilities:
  supported_protocols:
  - DIN_SPEC_70121
  supported_energy_services:
  - DC
# The EVCC-requested energy transfer mode is a message-field-tree leaf now (#105),
# single-sourced under ChargeParameterDiscoveryReq (its only required leaf).
message_field_tree:
  DIN_SPEC_70121:
    ChargeParameterDiscoveryReq:
      EVRequestedEnergyTransferType: DC_core
residual:
  # EV DC charge-ramp start seeds relocated from the retired
  # `power.ev_dc` block (#102): no static wire form, so residual.
  charge_ramp:
    target_voltage_v: 800.0
    target_current_a: 1.5
    remaining_time_to_full_soc_s: 1800
    remaining_time_to_bulk_soc_s: 900
  network:
    interface: acccs_evcc
  tls:
    enable_tls_1_3: false
    use_tls: false
    enforce_tls: false
role: evcc
