# Conformance ISO 15118-20 EIM EVCC test personality.
#
# Mirrors `iso20-evcc.yaml` but selects EIM auth. ISO 15118-20 mandates
# TLS 1.3 regardless of auth mode (`app/secc/secc_settings.py` rejects
# TLS-off with ISO-20), so this personality keeps TLS on. Pairs with
# `iso20-eim-secc.yaml` via the `iso20-eim-dc` scenario.
role: evcc
identity:
  evcc_id: 1FMVAA45B63C47DD58Y6
network:
  interface: acccs_evcc
tls:
  enable_tls_1_3: true
  use_tls: true
capabilities:
  supported_protocols:
    - ISO_15118_20_DC
  supported_auth_modes:
    - EIM
  supported_energy_services:
    - DC
  energy_transfer_mode: DC_extended
