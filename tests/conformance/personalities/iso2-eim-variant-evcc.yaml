# Conformance ISO 15118-2 EIM EVCC variant test personality.
#
# Mirrors `personalities/iso2_eim_dc.yaml` so the E2E suite
# can pin an `iso2-eim-variant` scenario without dragging the example
# file into the conformance test directory. The interface (network/) is
# the conformance veth pair; everything else matches the variant.
identity:
  evse_id: USFRDE9001
  evcc_id: 1FATCBFLAGSHIPDC0001
capabilities:
  supported_protocols:
  - ISO_15118_2
  supported_auth_modes:
  - EIM
  supported_energy_services:
  - DC
  energy_transfer_mode: DC_extended
power:
  ev_dc:
    max_voltage_v: 900.0
    max_current_a: 220.0
    max_power_w: 180000.0
    energy_capacity_wh: 95000.0
    target_voltage_v: 780.0
    target_current_a: 1.5
    remaining_time_to_full_soc_s: 2400
    remaining_time_to_bulk_soc_s: 1200
    iso2_energy_request_wh: 18000.0
    iso2_full_soc_percent: 95
    iso2_bulk_soc_percent: 75
residual:
  network:
    interface: acccs_evcc
  tls:
    enable_tls_1_3: false
    use_tls: false
    enforce_tls: false
role: evcc
