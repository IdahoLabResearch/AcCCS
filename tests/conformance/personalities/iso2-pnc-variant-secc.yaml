# Conformance ISO 15118-2 PnC SECC variant test personality.
capabilities:
  supported_protocols:
  - ISO_15118_2
  supported_auth_modes:
  - PNC
  supported_energy_services:
  - DC
  is_cert_install_needed: false
residual:
  # SECC meter-reading start seed (relocated from the retired `meter` block, #105).
  # The ISO-2 SECC does not emit MeterInfo (meter_info stays None), so the id is
  # dropped and this seed is unused on the wire — kept for parity with the model.
  metering:
    starting_reading_wh: 777000
  network:
    interface: acccs_secc
  tls:
    enable_tls_1_3: true
    use_tls: true
    enforce_tls: true
    sdp_retry_cycles: 2
  certificates:
    pki_path: app/shared/pki/
    max_contract_certs: 5
role: secc
