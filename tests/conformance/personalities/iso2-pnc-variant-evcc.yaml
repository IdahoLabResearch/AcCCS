# Conformance ISO 15118-2 PnC EVCC variant test personality.
capabilities:
  supported_protocols:
  - ISO_15118_2
  supported_auth_modes:
  - PNC
  supported_energy_services:
  - DC
  is_cert_install_needed: false
residual:
  # EV DC charge-ramp start seeds relocated from the retired
  # `power.ev_dc` block (#102): no static wire form, so residual.
  charge_ramp:
    target_voltage_v: 850.0
    target_current_a: 1.7
    remaining_time_to_full_soc_s: 3000
    remaining_time_to_bulk_soc_s: 1500
  network:
    interface: acccs_evcc
  tls:
    enable_tls_1_3: true
    use_tls: true
    enforce_tls: true
    sdp_retry_cycles: 2
  certificates:
    pki_path: app/shared/pki/
    max_contract_certs: 5
role: evcc
