# Example ISO 15118-20 AC variant personality.
#
# Showcases the ISO-20 AC energy-service fields landed in issue #9. Every
# field below differs from `default-{evcc,secc}.yaml` in a way observable
# on the wire (logs or pcap) so the personality-swap promise from
# ADR-0001 stays demonstrable.
#
# Run an ISO 15118-20 AC session with this personality on both sides:
#
#   python run_secc.py --config example_iso20_ac_variant --virtual
#   python run_evcc.py --config example_iso20_ac_variant --virtual
#
# Symmetric shape (no `role:` field) so the loader accepts either role.

capabilities:
  # ISO 15118-20 AC-only.
  supported_protocols:
    - ISO_15118_20_AC
  supported_energy_services:
    - AC
  # ISO-20 mandates TLS 1.3; the variant keeps it on.

meter:
  meter_id: Switch-Meter-ISO20-AC-001
  starting_reading_wh: 200000
