# Example ISO 15118-20 AC variant personality.
#
# Showcases the ISO-20 AC energy-service fields landed in issue #9. Every
# field below differs from `default-{evcc,secc}.yaml` in a way observable
# on the wire (logs or pcap) so the personality-swap promise from
# ADR-0001 stays demonstrable.
#
# Run an ISO 15118-20 AC session with this personality on both sides:
#
#   python run_secc.py --config personalities/example_iso20_ac_variant.yaml --virtual
#   python run_evcc.py --config personalities/example_iso20_ac_variant.yaml --virtual
#
# Symmetric shape (no `role:` field) so the loader accepts either role.

identity:
  evse_id: USINL20AC01
  evcc_id: 1FATCISO20AC0000ABC1

capabilities:
  # ISO 15118-20 AC-only.
  supported_protocols:
    - ISO_15118_20_AC
  supported_energy_services:
    - AC
  # ISO-20 mandates TLS 1.3; the variant keeps it on.

power:
  evse_ac_v20:
    # Larger AC envelope than the stock 30 kW so ACChargeParameterDiscoveryRes
    # power values change visibly per phase.
    max_charge_power_w: 50000.0
    min_charge_power_w: 200.0
    nominal_frequency_hz: 60.0
    max_power_asymmetry_w: 100.0
    power_ramp_limit_w_per_s: 250.0
  ev_ac_v20:
    max_charge_power_w: 22000.0
    min_charge_power_w: 200.0
    scheduled_present_active_power_w: 150000.0
    dynamic_max_charge_power_w: 250000.0
    dynamic_min_charge_power_w: 200.0
    dynamic_present_active_power_w: 150000.0
    dynamic_present_reactive_power_w: 15000.0
  schedule_exchange_v20:
    departure_time_s: 5400
    scheduled_target_energy_request_wh: 15000.0
    scheduled_max_energy_request_wh: 25000.0
    scheduled_min_energy_request_wh: 0.5
    dynamic_min_soc_percent: 20
    dynamic_target_soc_percent: 75
    dynamic_target_energy_request_wh: 35000.0
    dynamic_max_energy_request_wh: 55000.0
    dynamic_min_energy_request_wh: -15000.0
    dynamic_max_v2x_energy_request_wh: 4000.0
    dynamic_min_v2x_energy_request_wh: 0.0
    ac_dynamic_loop_departure_time_s: 1800
    power_schedule_duration_s: 2700
    power_schedule_power_w: -8000.0
    price_currency: USD
    price_energy_fee: 0.15
  evse_schedule_exchange_v20:
    schedule_duration_s: 2700
    charge_power_w: 22000.0
    available_energy_wh: 250000.0
    power_tolerance_w: 1500.0
    discharge_power_w: 8000.0
    dynamic_departure_time_s: 5400
    dynamic_min_soc_percent: 20
    dynamic_target_soc_percent: 75

meter:
  meter_id: Switch-Meter-ISO20-AC-001
  starting_reading_wh: 200000
