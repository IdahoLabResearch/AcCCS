# Example ISO 15118-2 EIM (External Identification Means) EVCC variant.
#
# The EVCC half of the retired symmetric `iso2_eim_dc.yaml` (ADR-0006 / #96 split
# it per role, mirroring how DIN retired `din_dc_extended.yaml`). ISO-2 EVCC is
# still pre-tree this slice, so this stays a structured personality (its
# `power.ev_dc` fields drive the EVCC's ChargeParameterDiscoveryReq / PreCharge /
# CurrentDemand). The SECC counterpart `iso2_eim_dc-secc.yaml` is tree-backed and
# `extends: iso2-secc-baseline`.
#
# Run an ISO-2 EIM session:
#   python run_secc.py --config iso2_eim_dc-secc --virtual
#   python run_evcc.py --config iso2_eim_dc-evcc --virtual
role: evcc
identity:
  evse_id: USFRDE9001
  evcc_id: 1FATCBFLAGSHIPDC0001
capabilities:
  supported_protocols:
  - ISO_15118_2
  supported_auth_modes:
  - EIM
  supported_energy_services:
  - DC
  energy_transfer_mode: DC_extended
power:
  ev_dc:
    max_voltage_v: 900.0
    max_current_a: 220.0
    max_power_w: 180000.0
    energy_capacity_wh: 95000.0
    target_voltage_v: 780.0
    target_current_a: 1.5
    remaining_time_to_full_soc_s: 2400
    remaining_time_to_bulk_soc_s: 1200
    iso2_energy_request_wh: 18000.0
    iso2_full_soc_percent: 95
    iso2_bulk_soc_percent: 75
meter:
  meter_id: Switch-Meter-EIM-001
  starting_reading_wh: 555000
residual:
  tls:
    enable_tls_1_3: false
    use_tls: false
    enforce_tls: false
