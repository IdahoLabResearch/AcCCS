# Example ISO 15118-2 EIM (External Identification Means) EVCC device.
#
# The EVCC half of the retired symmetric `iso2_eim_dc.yaml`. A thin device
# override that `extends: iso2-evcc-baseline` (the Mach-E-reference tree) — the
# baseline is already EIM / no-TLS, so this only supplies the vehicle's identity
# and its target-voltage/current start values (the config-driven carve-out that
# seeds the first PreCharge / CurrentDemand before the runtime charge controller
# ramps real targets). Every wire value — the DC envelope, the SOC pins — is
# inherited from the tree-backed baseline, the vehicle-side analogue of the thin
# `iso2_eim_dc-secc.yaml`.
#
# Run an ISO-2 EIM session (TLS is off for EIM, so no PKI needed):
#   python run_secc.py --config iso2_eim_dc-secc --virtual
#   python run_evcc.py --config iso2_eim_dc-evcc --virtual
extends: iso2-evcc-baseline
role: evcc
identity:
  evcc_id: 1FATCBFLAGSHIPDC0001
power:
  ev_dc:
    # The Mach-E envelope pins EVMaximumVoltageLimit to 422 V (in the baseline
    # tree), so the target start voltage stays under it. PreCharge also requires
    # target_current < 2 A (IEC 61851-23 CC.5.2 inrush limit).
    target_voltage_v: 400.0
    target_current_a: 1.5
