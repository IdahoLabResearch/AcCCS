# Example ISO 15118-2 PnC (Plug-and-Charge) variant personality.
#
# Showcases the ISO-2 personality fields landed in issue #8. PnC auth means
# the EV presents a contract certificate chain and the EVSE verifies a
# signed AuthorizationReq — TLS is mandatory. Fields below differ from
# `default-{evcc,secc}.yaml` in a way that's observable on the wire so the
# personality-swap promise from ADR-0001 stays demonstrable.
#
# Run an ISO-2 PnC session with this personality on both sides (PKI certs
# under app/shared/pki/iso15118_2/certs/ are required — see CLAUDE.md):
#
#   python run_secc.py --config iso2_pnc_dc --virtual
#   python run_evcc.py --config iso2_pnc_dc --virtual
#
# Symmetric shape (no `role:` field) so the loader accepts either role.
identity:
  evse_id: USFRDE9002
  evcc_id: 1FATCBFLAGSHIPDC0002
capabilities:
  supported_protocols:
  - ISO_15118_2
  supported_auth_modes:
  - PNC
  supported_energy_services:
  - DC
  energy_transfer_mode: DC_extended
  is_cert_install_needed: false
power:
  evse_dc:
    max_voltage_v: 1000.0
    min_voltage_v: 100.0
    max_current_a: 400.0
    min_current_a: 10.0
    max_power_w: 350000.0
    peak_current_ripple_a: 8.0
    nominal_voltage_v: 500.0
    iso2_sa_schedule_pmax_w: 75000
    iso2_sales_tariff_id: 99
  ev_dc:
    max_voltage_v: 950.0
    max_current_a: 280.0
    max_power_w: 250000.0
    energy_capacity_wh: 120000.0
    target_voltage_v: 850.0
    target_current_a: 1.7
    remaining_time_to_full_soc_s: 3000
    remaining_time_to_bulk_soc_s: 1500
    iso2_energy_request_wh: 25000.0
    iso2_full_soc_percent: 100
    iso2_bulk_soc_percent: 85
meter:
  meter_id: Switch-Meter-PnC-002
  starting_reading_wh: 777000
residual:
  tls:
    enable_tls_1_3: true
    use_tls: true
    enforce_tls: true
    sdp_retry_cycles: 2
  certificates:
    pki_path: app/shared/pki/
    max_contract_certs: 5
