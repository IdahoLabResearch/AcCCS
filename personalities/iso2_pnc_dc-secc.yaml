# Example ISO 15118-2 PnC (Plug-and-Charge) SECC device personality (ADR-0006 /
# #96).
#
# The SECC half of the retired symmetric `iso2_pnc_dc.yaml`. A device override
# that `extends: iso2-secc-baseline` (the HAL-reference EIM tree) and overrides
# the leaves a PnC charger differs on: it advertises the Contract (PnC) payment
# option instead of the baseline's ExternalPayment (EIM), turns TLS on, points at
# the contract-cert PKI, and pins its own EVSEID. The DC envelope and isolation
# progression are inherited from the tree-backed baseline.
#
# PKI certs under app/shared/pki/iso15118_2/certs/ are required (see CLAUDE.md).
# Run an ISO-2 PnC session:
#   python run_secc.py --config iso2_pnc_dc-secc --virtual
#   python run_evcc.py --config iso2_pnc_dc-evcc --virtual
extends: iso2-secc-baseline
role: secc
capabilities:
  supported_auth_modes:
  - PNC
  is_cert_install_needed: false
residual:
  tls:
    enable_tls_1_3: true
    use_tls: true
    enforce_tls: true
    sdp_retry_cycles: 2
  certificates:
    pki_path: app/shared/pki/
    max_contract_certs: 5
message_field_tree:
  ISO_15118_2:
    # PnC advertises the Contract payment option (baseline is EIM / ExternalPayment).
    ServiceDiscoveryRes:
      PaymentOptionList:
        PaymentOption:
          - Contract
    SessionSetupRes:
      EVSEID: USFRDE9002
    CurrentDemandRes:
      EVSEID: USFRDE9002
