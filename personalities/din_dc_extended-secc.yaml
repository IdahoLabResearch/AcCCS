# Default DIN 70121 SECC personality — DC_extended energy transfer mode.
#
# This is the default `--config` for run_secc.py. It `extends:` the DIN SECC
# baseline (ADR-0006) and overrides only the ABB-style DC power envelope +
# EVSEID that make this a concrete charger. The advertised/accepted DC_extended
# mode is inherited from the baseline's message field tree.
#
# Replaces the retired symmetric din_dc_extended.yaml (now split per role): it
# advertises DC_extended, which is what production vehicles request via
# EVRequestedEnergyTransferType=DC_extended (type 3).
extends: din-secc-baseline
role: secc
identity:
  evse_id: 55AA66BB77
power:
  evse_dc:
    max_voltage_v: 950.0
    min_voltage_v: 50.0
    max_current_a: 350.0
    min_current_a: 5.0
    max_power_w: 240000.0
    peak_current_ripple_a: 7.0
    nominal_voltage_v: 480.0
    # DIN PMaxSchedule is int16-bounded (0..32767 W).
    sa_schedule_pmax_w: 30000
    sa_schedule_duration_s: 1800
