# Default DIN 70121 SECC personality — the ABB DC_extended charger.
#
# This is the default `--config` for run_secc.py. It `extends:` the DIN SECC
# baseline (ADR-0006), which now replicates the ABB charger from
# `ABB_Cadillac_Lyric.pcapng` field-for-field (#73): EVSEID `00`, the DC
# envelope (max V 451 / max A 60 / max W 24000 / min V 150 / min A 1 / peak
# ripple 3), the SAScheduleList PMax 24000 W, and the isolation-status
# progression (Invalid / IsolationMonitoringActive through
# ChargeParameterDiscoveryRes + CableCheckRes, then Valid / EVSE_Ready from
# PreChargeRes on). All of that is inherited from the baseline's message field
# tree — the SECC DIN wire values are no longer sourced from the retired
# structured `power.evse_dc` block.
#
# It advertises DC_extended, which is what production vehicles request via
# EVRequestedEnergyTransferType=DC_extended (type 3) — inherited from the
# baseline's ServiceDiscoveryRes -> ChargeService -> EnergyTransferType leaf,
# the same value the ChargeParameterDiscovery WrongEnergyTransferType
# reject-gate compares against (advertised == accepted, by construction).
#
# Replaces the retired symmetric din_dc_extended.yaml (now split per role).
extends: din-secc-baseline
role: secc
