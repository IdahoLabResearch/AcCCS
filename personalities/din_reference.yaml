# Example DIN 70121 variant personality.
#
# Showcases the personality-swap promise from ADR-0001 / issue #7. With the
# pre-tree `identity`/`power` structured wire sections retired (#102), a
# non-tree-backed file like this can no longer pin arbitrary wire values (those
# are now tree-owned — see `din-secc-baseline.yaml` for a tree-backed DIN
# device). What still differs observably from the stock defaults: the device
# advertises/requests `DC_core` energy transfer mode — a message-field-tree leaf
# now (#105), single-sourced under ServiceDiscoveryRes (SECC advertised) and
# ChargeParameterDiscoveryReq (EVCC requested) — and the EVCC seeds a higher
# PreCharge target via `residual.charge_ramp`.
#
# Run a DIN session with this personality on both sides:
#
#   python run_secc.py --config din_reference --virtual
#   python run_evcc.py --config din_reference --virtual
#
# This file works for both the EVCC and the SECC because the section shapes
# are symmetric (each role only consumes the fields relevant to it): the SECC
# reads the ServiceDiscoveryRes subtree, the EVCC the ChargeParameterDiscoveryReq
# leaf; each role's completeness check ignores the other role's messages. The
# `role:` field is intentionally omitted so the loader doesn't reject one
# side or the other.
capabilities:
  supported_protocols:
  - DIN_SPEC_70121
  supported_energy_services:
  - DC
residual:
  tls:
    enable_tls_1_3: false
    use_tls: false
    enforce_tls: false
  charge_ramp:
    # EVCC PreCharge/CurrentDemand target start seeds (the SECC ignores these).
    target_voltage_v: 800.0
    target_current_a: 1.5
    remaining_time_to_full_soc_s: 1800
    remaining_time_to_bulk_soc_s: 900
message_field_tree:
  DIN_SPEC_70121:
    # SECC-advertised energy transfer mode (the reject-gate reads the same leaf,
    # so advertised == accepted). ServiceDiscoveryRes is completeness-checked
    # only when this file loads as an SECC, so its other required leaves
    # (PaymentOptions / ServiceTag / FreeService) are spelled out here.
    ServiceDiscoveryRes:
      PaymentOptions:
        PaymentOption:
          - ExternalPayment
      ChargeService:
        ServiceTag:
          ServiceID: 1
          ServiceCategory: EVCharging
        FreeService: false
        EnergyTransferType: DC_core
    # EVCC-requested energy transfer mode (only required leaf of this message,
    # checked when this file loads as an EVCC).
    ChargeParameterDiscoveryReq:
      EVRequestedEnergyTransferType: DC_core
