# Example ISO 15118-20 DC variant personality.
#
# Showcases the ISO-20 DC energy-service fields landed in issue #9. Every
# field below differs from `default-{evcc,secc}.yaml` in a way observable
# on the wire (logs or pcap) so the personality-swap promise from
# ADR-0001 stays demonstrable.
#
# Run an ISO 15118-20 DC session with this personality on both sides:
#
#   python run_secc.py --config iso20_dc --virtual
#   python run_evcc.py --config iso20_dc --virtual
#
# Symmetric shape (no `role:` field) so the loader accepts either role.

identity:
  evse_id: USINL20DC01
  evcc_id: 1FATCISO20DC0000ABC2

capabilities:
  # ISO 15118-20 DC-only.
  supported_protocols:
    - ISO_15118_20_DC
  supported_energy_services:
    - DC

power:
  evse_dc_v20:
    # Larger envelope than the stock 1 kW so the v20 CPD power / current /
    # voltage values change visibly on the wire.
    max_charge_power_w: 350000.0
    min_charge_power_w: 250.0
    max_charge_current_a: 500.0
    min_charge_current_a: 5.0
    max_voltage_v: 920.0
    min_voltage_v: 50.0
    power_ramp_limit_w_per_s: 50.0
  ev_dc_v20:
    max_charge_power_w: 320000.0
    min_charge_power_w: 150.0
    max_charge_current_a: 400.0
    min_charge_current_a: 5.0
    max_voltage_v: 920.0
    min_voltage_v: 60.0
    target_voltage_v: 800.0
    target_current_a: 250.0
    dynamic_target_energy_request_wh: 250.0
    dynamic_max_energy_request_wh: 250.0
    dynamic_min_energy_request_wh: 25.0
    dynamic_max_charge_power_w: 5000.0
    dynamic_min_charge_power_w: 500.0
    dynamic_max_charge_current_a: 50.0
    dynamic_max_voltage_v: 500.0
    dynamic_min_voltage_v: 50.0
  schedule_exchange_v20:
    departure_time_s: 6000
    scheduled_target_energy_request_wh: 18000.0
    scheduled_max_energy_request_wh: 30000.0
    scheduled_min_energy_request_wh: 1.0
    dynamic_min_soc_percent: 25
    dynamic_target_soc_percent: 90
    dynamic_target_energy_request_wh: 50000.0
    dynamic_max_energy_request_wh: 75000.0
    dynamic_min_energy_request_wh: 0.0
    power_schedule_duration_s: 2400
    power_schedule_power_w: -15000.0
    price_currency: EUR
    price_energy_fee: 0.20
  evse_schedule_exchange_v20:
    schedule_duration_s: 2400
    charge_power_w: 20000.0
    available_energy_wh: 400000.0
    power_tolerance_w: 1000.0
    discharge_power_w: 5000.0
    dynamic_departure_time_s: 6000
    dynamic_min_soc_percent: 25
    dynamic_target_soc_percent: 90

meter:
  meter_id: Switch-Meter-ISO20-DC-001
  starting_reading_wh: 300000
