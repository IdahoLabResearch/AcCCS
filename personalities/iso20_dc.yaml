# Example ISO 15118-20 DC variant personality.
#
# Showcases the ISO-20 DC energy-service fields landed in issue #9. Every
# field below differs from `default-{evcc,secc}.yaml` in a way observable
# on the wire (logs or pcap) so the personality-swap promise from
# ADR-0001 stays demonstrable.
#
# Run an ISO 15118-20 DC session with this personality on both sides:
#
#   python run_secc.py --config iso20_dc --virtual
#   python run_evcc.py --config iso20_dc --virtual
#
# Symmetric shape (no `role:` field) so the loader accepts either role.

capabilities:
  # ISO 15118-20 DC-only.
  supported_protocols:
    - ISO_15118_20_DC
  supported_energy_services:
    - DC

meter:
  meter_id: Switch-Meter-ISO20-DC-001
  starting_reading_wh: 300000
