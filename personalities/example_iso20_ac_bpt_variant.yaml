# Example ISO 15118-20 AC-BPT (Bidirectional Power Transfer) variant personality.
#
# Showcases the AC-BPT discharge envelope landed in issue #9. The
# `supported_energy_services` is set to `AC_BPT` so the EVCC selects the
# bidirectional service, and the BPT discharge fields on both `evse_ac_v20`
# and `ev_ac_v20` populate the wire-side BPT extensions.
#
# Run with:
#
#   python run_secc.py --config example_iso20_ac_bpt_variant --virtual
#   python run_evcc.py --config example_iso20_ac_bpt_variant --virtual

capabilities:
  supported_protocols:
    - ISO_15118_20_AC
  supported_energy_services:
    - AC_BPT

# Meter identity is a wire value emitted inside ACChargeLoopRes -> MeterInfo, so
# it is a message-field-tree leaf (#105); the reading start seed has no static
# wire form, so it lives in the residual section.
residual:
  metering:
    starting_reading_wh: 412000
message_field_tree:
  ISO_15118_20_AC:
    ACChargeLoopRes:
      MeterInfo:
        MeterID: Switch-Meter-ISO20-ACBPT-001
