# Example ISO 15118-20 DC-BPT (Bidirectional Power Transfer) variant personality.
#
# Showcases the DC-BPT discharge envelope landed in issue #9. The
# `supported_energy_services` is set to `DC_BPT` so the EVCC selects the
# bidirectional service, and the BPT discharge fields on both `evse_dc_v20`
# and `ev_dc_v20` populate the wire-side BPT extensions.
#
# Run with:
#
#   python run_secc.py --config example_iso20_dc_bpt_variant --virtual
#   python run_evcc.py --config example_iso20_dc_bpt_variant --virtual

capabilities:
  supported_protocols:
    - ISO_15118_20_DC
  supported_energy_services:
    - DC_BPT

# Meter identity is a wire value emitted inside DCChargeLoopRes -> MeterInfo, so
# it is a message-field-tree leaf (#105); the reading start seed has no static
# wire form, so it lives in the residual section.
residual:
  metering:
    starting_reading_wh: 525000
message_field_tree:
  ISO_15118_20_DC:
    DCChargeLoopRes:
      MeterInfo:
        MeterID: Switch-Meter-ISO20-DCBPT-001
