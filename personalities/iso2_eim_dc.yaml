# Example ISO 15118-2 EIM (External Identification Means) variant personality.
#
# Showcases the ISO-2 personality fields landed in issue #8. EIM auth means
# no certificate exchange — the EVSE accepts an out-of-band identifier
# instead of running Plug-and-Charge. Every field below differs from
# `default-{evcc,secc}.yaml` in a way observable on the wire (logs or
# pcap) so the personality-swap promise from ADR-0001 stays demonstrable.
#
# Run an ISO-2 session with this personality on both sides:
#
#   python run_secc.py --config iso2_eim_dc --virtual
#   python run_evcc.py --config iso2_eim_dc --virtual
#
# Symmetric shape (no `role:` field) so the loader accepts either role.
identity:
  evse_id: USFRDE9001
  evcc_id: 1FATCBFLAGSHIPDC0001
capabilities:
  supported_protocols:
  - ISO_15118_2
  supported_auth_modes:
  - EIM
  supported_energy_services:
  - DC
  energy_transfer_mode: DC_extended
power:
  evse_dc:
    max_voltage_v: 920.0
    min_voltage_v: 50.0
    max_current_a: 300.0
    min_current_a: 5.0
    max_power_w: 200000.0
    peak_current_ripple_a: 6.0
    nominal_voltage_v: 480.0
    iso2_sa_schedule_pmax_w: 50000
    iso2_sales_tariff_id: 42
  ev_dc:
    max_voltage_v: 900.0
    max_current_a: 220.0
    max_power_w: 180000.0
    energy_capacity_wh: 95000.0
    target_voltage_v: 780.0
    target_current_a: 1.5
    remaining_time_to_full_soc_s: 2400
    remaining_time_to_bulk_soc_s: 1200
    iso2_energy_request_wh: 18000.0
    iso2_full_soc_percent: 95
    iso2_bulk_soc_percent: 75
meter:
  meter_id: Switch-Meter-EIM-001
  starting_reading_wh: 555000
residual:
  tls:
    enable_tls_1_3: false
    use_tls: false
    enforce_tls: false
