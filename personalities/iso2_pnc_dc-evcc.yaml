# Example ISO 15118-2 PnC (Plug-and-Charge) EVCC device.
#
# The EVCC half of the retired symmetric `iso2_pnc_dc.yaml`. A device override
# that `extends: iso2-evcc-baseline` (the Mach-E-reference EIM tree) and
# overrides the leaves a PnC vehicle differs on: it selects the Contract (PnC)
# payment option instead of the baseline's EIM, turns TLS on, and points at the
# contract-cert PKI. The DC envelope and SOC pins are inherited from the
# tree-backed baseline; the SelectedPaymentOption is runtime-negotiated from the
# auth mode, so it is not a tree leaf. The counterpart is `iso2_pnc_dc-secc.yaml`.
#
# PKI certs under app/shared/pki/iso15118_2/certs/ are required (see CLAUDE.md).
# Run an ISO-2 PnC session:
#   python run_secc.py --config iso2_pnc_dc-secc --virtual
#   python run_evcc.py --config iso2_pnc_dc-evcc --virtual
extends: iso2-evcc-baseline
role: evcc
identity:
  evcc_id: 1FATCBFLAGSHIPDC0002
capabilities:
  supported_auth_modes:
    - PNC
  is_cert_install_needed: false
power:
  ev_dc:
    # The Mach-E envelope pins EVMaximumVoltageLimit to 422 V (in the baseline
    # tree), so the target start voltage stays under it. PreCharge also requires
    # target_current < 2 A (IEC 61851-23 CC.5.2 inrush limit).
    target_voltage_v: 410.0
    target_current_a: 1.7
residual:
  tls:
    enable_tls_1_3: true
    use_tls: true
    enforce_tls: true
    sdp_retry_cycles: 2
  certificates:
    pki_path: app/shared/pki/
    max_contract_certs: 5
