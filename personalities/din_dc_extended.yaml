# Default DIN 70121 personality — DC_extended energy transfer mode.
#
# This is the default `--config` for both run scripts. Unlike
# `din_reference.yaml` (which intentionally advertises the *alternate*
# DC_core mode to demonstrate a personality swap on the wire), this
# personality advertises DC_extended, which is what production vehicles
# request via EVRequestedEnergyTransferType=DC_extended (type 3). A
# DC_core SECC rejects those vehicles at ChargeParameterDiscovery, so the
# real-vehicle-friendly DC_extended mode is the sensible default.
#
# Symmetric like din_reference: each role consumes only the fields relevant
# to it, and `role:` is intentionally omitted so the loader accepts it for
# both the EVCC and the SECC.

identity:
  evse_id: 55AA66BB77
  evcc_id: 5YJSA1E60GF000123ABC

capabilities:
  supported_protocols:
    - DIN_SPEC_70121
  supported_energy_services:
    - DC
  energy_transfer_mode: DC_extended

tls:
  # DIN does not use TLS.
  enable_tls_1_3: false
  use_tls: false
  enforce_tls: false

power:
  evse_dc:
    max_voltage_v: 950.0
    min_voltage_v: 50.0
    max_current_a: 350.0
    min_current_a: 5.0
    max_power_w: 240000.0
    peak_current_ripple_a: 7.0
    nominal_voltage_v: 480.0
    # DIN PMaxSchedule is int16-bounded (0..32767 W).
    sa_schedule_pmax_w: 30000
    sa_schedule_duration_s: 1800
  ev_dc:
    max_voltage_v: 920.0
    max_current_a: 250.0
    max_power_w: 230000.0
    energy_capacity_wh: 100000.0
    target_voltage_v: 800.0
    target_current_a: 1.5
    remaining_time_to_full_soc_s: 1800
    remaining_time_to_bulk_soc_s: 900
