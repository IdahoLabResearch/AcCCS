# Cert-free "smoke" SECC personality (issue #23).
#
# Identical to the stock `default-secc.yaml` except for two sections:
# `tls:` disables encryption, and `capabilities.supported_protocols` drops the
# ISO 15118-20 entries (they mandate TLS 1.3, so the loader refuses to start a
# -20 session without it). This lets a fresh clone run the virtual EVCC <->
# SECC demo without first generating PKI certs via `create_certs.sh`. The
# cert-enabled stock default remains the realistic-testing path.
#
# This file is *generated* from the Pydantic defaults plus the `NO_TLS`
# posture in `app/shared/personality/model.py` by
# `scripts/regen_personality_defaults.py`. Edit the model, then rerun the
# script. The drift test (tests/personality/test_drift.py) guards against
# this file falling out of sync.
#
# See ADR-0001 for the personality concept and ADR-0006 for the two-part
# split: the `message_field_tree` (wire values) and the `residual` section
# (tls/slac/certificates/network/charge_profile/behavior — no wire form).
capabilities:
  supported_protocols:
  - DIN_SPEC_70121
  - ISO_15118_2
  supported_auth_modes:
  - PNC
  - EIM
  supported_energy_services:
  - DC
  energy_transfer_mode: DC_extended
  free_charging_service: false
  free_cert_install_service: true
  allow_cert_install_service: true
  standby_allowed: false
  is_cert_install_needed: false
  max_supporting_points: 1024
meter:
  meter_id: Switch-Meter-123
  starting_reading_wh: 12345
residual:
  network:
    interface: acccs_secc
  slac:
    sound_timeout_ms: 1000
    nid_hex: 9cb0b2bbf56c0e
    nmk_hex: 48fe5602dbaccde51edadc3e081a52d1
  tls:
    enable_tls_1_3: false
    use_tls: false
    enforce_tls: false
    sdp_retry_cycles: 1
  certificates:
    pki_path: app/shared/pki/
    max_contract_certs: 3
  charge_profile:
    cycle: 10
    delay_seconds: 0
  charge_ramp:
    target_voltage_v: 500.0
    target_current_a: 1.0
    remaining_time_to_full_soc_s: 100
    remaining_time_to_bulk_soc_s: 80
  behavior:
    use_cpo_backend: false
message_field_tree: {}
role: secc
