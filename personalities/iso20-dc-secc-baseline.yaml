# ISO 15118-20 DC SECC baseline personality (ADR-0006, issue #98).
#
# The per-role baseline supplies an ISO-20 DC SECC's full default wire output;
# device files `extends:` this and override only the leaves that differ. Mirrors
# the DIN (#73) and ISO-2 (#96) SECC slices across the ISO-20 DC path: every
# SECC-emitted ISO-20 DC message routes its build through construction-time
# substitution (ADR-0006 protocol-keyed amendment) sourcing its wire values from
# the `message_field_tree` below, and the structured `power.evse_dc_v20` /
# `power.evse_schedule_exchange_v20` ISO-20 SECC reads are retired.
#
# PROVENANCE — capture-seeded, decoded field-for-field from `~/projects/pcaps/
# iso20.pcap`, a real charger's ISO-15118-20 **DC-BPT / Dynamic control mode /
# EIM** session. `iso20.pcap` decodes cleanly as ISO-20 DC with the project EXI
# codec (payload type 0x8004 DC_MAINSTREAM; SECC source port 53927) — plaintext
# on the wire, unlike the TLS-encrypted `HAL+TLS*+ISO20_DC_BPT_Example.pcap`
# captures. (The two HAL DC-BPT captures are TLS-encrypted, so the synthetic
# `EVSEDCLimitsV20` / `EVSEScheduleExchangeV20` fallback the issue reserves for
# an undecodable capture is not needed here.) The decodable SECC-emitted
# messages are reproduced exactly:
#   * SessionSetupRes.EVSEID = PcLoadLetter (tree-pinned identity).
#   * DCChargeParameterDiscoveryRes.BPT_DC_CPDResEnergyTransferMode — the DC-BPT
#     envelope (44000 W / 110 A / 1000 V charge maxima, 200 V min, 100 W/s ramp;
#     -44000 W / -110 A discharge maxima), the retired `power.evse_dc_v20`
#     values, now tree-sourced. This value flows on into the EVSE session limits
#     the DCChargeLoopRes control-mode envelope reports (the state applies the
#     tree before `update_dc_charge_parameters_v20`), so the capture's
#     BPT_Dynamic_DC_CLResControlMode envelope is reproduced without a second
#     tree entry.
#
# Builder-computed / runtime fields are NOT in the tree and stay computed
# (ADR-0006 #83 optional-field allowlist, extended to ISO-20 DC SECC in #98):
# ResponseCode; the EVSEProcessing ONGOING->FINISHED progression
# (Authorization / ScheduleExchange / DCCableCheck); the ramping present
# voltage / current and the DCChargeLoopRes limit-achieved flags; the
# ServiceDetailRes echoed ServiceID + emulator-built ParameterSet list. The
# header/envelope (SessionID, timestamp) stays deferred/compute-only (the tree
# is message-body only). The advertised energy-service list and auth services
# are single-sourced from the `capabilities` block below (the same ADR-0006
# dividing rule the ISO-2 slice uses for its service advertisement):
#   * AuthorizationSetupRes.AuthorizationServices = [EIM] <- supported_auth_modes
#   * ServiceDiscoveryRes.EnergyTransferServiceList = ServiceID 6 (DC_BPT) then
#     2 (DC) <- supported_energy_services; matches the capture's advertised pair.
#   * AuthorizationSetupRes.CertificateInstallationService = false (EIM, no PnC).
#
# ISO-20 mandates TLS 1.3 regardless of auth mode (`app/secc/secc_settings.py`
# rejects TLS-off with ISO-20), so this baseline keeps TLS on even though the
# source capture is plaintext — the reproduced artifact is the message *values*,
# not the transport. Devices extending this baseline inherit TLS on.
role: secc
capabilities:
  supported_protocols:
    - ISO_15118_20_DC
  supported_auth_modes:
    - EIM
  # DC_BPT first (ServiceID 6) then DC (ServiceID 2), matching the capture's
  # advertised EnergyTransferServiceList order.
  supported_energy_services:
    - DC_BPT
    - DC
residual:
  tls:
    enable_tls_1_3: true
    enforce_tls: true
message_field_tree:
  ISO_15118_20_DC:
    # The ISO-20 *common* messages (shared by AC and DC sessions) tree block,
    # declared once via a YAML anchor and merged into this protocol key. A
    # combined DC+AC personality (or the future ISO-20 AC SECC baseline slice)
    # aliases `*iso20_common_secc` under its `ISO_15118_20_AC` key so the shared
    # identity is stated once and consumed by both ISO-20 keys (ADR-0006
    # protocol-keyed amendment). Only SessionSetupRes carries a configured (non
    # runtime-produced) common leaf today — the charger's announced EVSEID.
    <<: &iso20_common_secc
      SessionSetupRes:
        EVSEID: PcLoadLetter
    # DC-specific messages. The DC-BPT envelope is the retired
    # `power.evse_dc_v20` block, now tree-sourced. Values are RationalNumber
    # (Exponent + Value) leaves; the discharge maxima are negative per the
    # capture (a BPT charger's discharge direction).
    DCChargeParameterDiscoveryRes:
      BPT_DC_CPDResEnergyTransferMode:
        EVSEMaximumChargePower: {Exponent: 1, Value: 4400}
        EVSEMinimumChargePower: {Exponent: 0, Value: 0}
        EVSEMaximumChargeCurrent: {Exponent: 0, Value: 110}
        EVSEMinimumChargeCurrent: {Exponent: 0, Value: 0}
        EVSEMaximumVoltage: {Exponent: 0, Value: 1000}
        EVSEMinimumVoltage: {Exponent: 0, Value: 200}
        EVSEPowerRampLimitation: {Exponent: 0, Value: 100}
        EVSEMaximumDischargePower: {Exponent: 1, Value: -4400}
        EVSEMinimumDischargePower: {Exponent: 0, Value: 0}
        EVSEMaximumDischargeCurrent: {Exponent: -2, Value: -11000}
        EVSEMinimumDischargeCurrent: {Exponent: 0, Value: 0}
