[pytest]
testpaths = tests
# The repo has an __init__.py at its root (the "AcCCS" package), so pytest's
# rootdir walks one level above this directory and `from app...` / `from
# tests...` imports fail without help. Prepending "." puts the repo root on
# sys.path so the conformance suite runs cleanly on a dev machine without
# needing PYTHONPATH set (CI sets it explicitly; this keeps local in parity).
pythonpath = .
asyncio_mode = auto
markers =
    veth: marks tests requiring the acccs_secc/acccs_evcc veth pair
